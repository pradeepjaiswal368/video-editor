<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f3"/>
      <stop offset="1" stop-color="#b9b9b4"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161a"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#2b2b31" stroke-width="2"/>
  <!-- subtle inner highlight -->
  <rect x="1" y="1" width="62" height="30" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>
  <!-- play triangle -->
  <path d="M27 21.5 L45.5 32 L27 42.5 Z" fill="url(#play)"/>
  <!-- film tick marks, clipped to the play shape -->
  <g fill="#ffffff" fill-opacity="0.28">
    <circle cx="50" cy="21" r="1.6"/>
    <circle cx="50" cy="28" r="1.6"/>
    <circle cx="50" cy="36" r="1.6"/>
    <circle cx="50" cy="43" r="1.6"/>
    <circle cx="14" cy="21" r="1.6"/>
    <circle cx="14" cy="28" r="1.6"/>
    <circle cx="14" cy="36" r="1.6"/>
    <circle cx="14" cy="43" r="1.6"/>
  </g>
</svg>
